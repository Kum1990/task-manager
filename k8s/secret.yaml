# Demo-only values. In a real cluster use a secret manager (e.g. Sealed Secrets, External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_USER: taskuser
  POSTGRES_PASSWORD: taskpass
  POSTGRES_DB: taskdb
  DATABASE_URL: postgres://taskuser:taskpass@postgres:5432/taskdb
  JWT_SECRET: k8s-demo-secret-change-me-please-0123456789
