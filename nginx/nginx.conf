log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time,'
  '"upstream":"$upstream_addr","upstream_time_s":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

upstream backend_api {
    server backend:4000;
}

upstream frontend_web {
    server frontend:8080;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log json_combined;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_read_timeout 30s;
    }

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://frontend_web;
    }
}
